<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterviewAI — Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090d13;--surface:#0f1318;--surface2:#161b22;--surface3:#1c2230;
  --border:rgba(255,255,255,0.07);--text:#dde3ed;--muted:#5a6478;
  --accent:#52a6ff;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa;
  --head:'Syne',sans-serif;--body:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(82,166,255,0.02)1px,transparent 1px),linear-gradient(90deg,rgba(82,166,255,0.02)1px,transparent 1px);background-size:56px 56px;pointer-events:none}
nav{position:sticky;top:0;z-index:100;background:rgba(9,13,19,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px}
.nav-logo{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:1rem;letter-spacing:-.02em}
.nav-logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#52a6ff,#4ade80);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-logo span{color:var(--accent)}
.btn-sm{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--body);font-size:.82rem;cursor:pointer;transition:all .2s}
.btn-sm:hover{background:var(--surface3)}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 24px 80px}
/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted);font-size:.9rem}
/* header */
.report-header{text-align:center;margin-bottom:48px;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.report-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(82,166,255,.08);border:1px solid rgba(82,166,255,.2);border-radius:20px;padding:6px 16px;font-size:.78rem;color:var(--accent);font-weight:600;margin-bottom:16px;letter-spacing:.04em}
.report-header h1{font-family:var(--head);font-size:2.2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.report-header .meta{color:var(--muted);font-size:.88rem}
.report-header .meta strong{color:var(--text)}
/* overall score ring */
.score-hero{display:flex;flex-direction:column;align-items:center;margin-bottom:48px;animation:fadeUp .5s .1s ease both}
.score-ring{position:relative;width:160px;height:160px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .ring-bg{fill:none;stroke:var(--surface2);stroke-width:8}
.score-ring .ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)}
.score-ring .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .ring-num{font-family:var(--head);font-size:2rem;font-weight:800;line-height:1}
.score-ring .ring-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.score-hero h2{font-family:var(--head);font-size:1rem;font-weight:700;margin-top:16px;margin-bottom:6px}
.score-hero p{font-size:.85rem;color:var(--muted);max-width:400px;text-align:center;line-height:1.6}
/* grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
/* card */
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;animation:fadeUp .5s ease both}
.rcard-title{font-family:var(--head);font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:7px}
.rcard-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* sub score bars */
.score-bar-row{display:flex;flex-direction:column;gap:14px}
.sb-item{display:flex;flex-direction:column;gap:6px}
.sb-label{display:flex;justify-content:space-between;font-size:.82rem}
.sb-label span:last-child{font-weight:700;font-family:var(--head)}
.sb-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.sb-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
/* bullets */
.bullet-list{display:flex;flex-direction:column;gap:9px}
.bullet-item{display:flex;align-items:flex-start;gap:10px;font-size:.85rem;line-height:1.5}
.bullet-item .bi{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px}
/* Q&A transcript */
.qa-list{display:flex;flex-direction:column;gap:16px}
.qa-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .2s}
.qa-item:hover{border-color:var(--border-hi)}
.qa-q{font-size:.82rem;font-weight:600;color:var(--accent);margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.qa-q-num{background:rgba(82,166,255,.1);border:1px solid rgba(82,166,255,.2);border-radius:5px;padding:1px 7px;font-size:.7rem;flex-shrink:0;margin-top:1px}
.qa-a{font-size:.83rem;color:var(--muted);line-height:1.6;margin-bottom:10px}
.qa-footer{display:flex;align-items:center;justify-content:space-between}
.qa-score{font-family:var(--head);font-size:.82rem;font-weight:700}
.qa-fb{font-size:.75rem;color:var(--muted);font-style:italic;max-width:70%;text-align:right;line-height:1.4}
/* summary */
.summary-text{font-size:.9rem;line-height:1.75;color:var(--muted)}
/* action row */
.action-row{display:flex;gap:12px;margin-top:32px;justify-content:center}
.btn-action{padding:12px 28px;border-radius:10px;font-family:var(--head);font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-dash{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-dash:hover{background:var(--surface3)}
.btn-new{background:linear-gradient(135deg,#3b82f6,#52a6ff);border:none;color:#fff;box-shadow:0 4px 20px rgba(82,166,255,.25)}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(82,166,255,.35)}
</style>
</head>
<body>
<nav>
  <div class="nav-logo"><div class="nav-logo-icon">🎙</div>Interview<span>AI</span></div>
  <button class="btn-sm" onclick="location.href='dashboard.html'">← Dashboard</button>
</nav>

<main id="main-content">
  <div class="loading" id="loader">
    <div class="spin"></div>
    <p>Generating your performance report…</p>
  </div>
</main>

<script>
const API='http://localhost:8000';
const token=localStorage.getItem('token');
const interviewId=parseInt(localStorage.getItem('report_interview_id'));
if(!token||!interviewId){location.href='dashboard.html';}
function authHdr(){return{'Content-Type':'application/json','Authorization':'Bearer '+token};}

function scoreColor(s){if(s>=75)return'var(--green)';if(s>=50)return'var(--yellow)';return'var(--red)';}
function scoreGrade(s){if(s>=85)return{g:'A',l:'Excellent'};if(s>=70)return{g:'B',l:'Good'};if(s>=55)return{g:'C',l:'Average'};return{g:'D',l:'Needs Work'};}
function parseBullets(s){return(s||'').split('|').map(x=>x.trim()).filter(Boolean);}

async function loadReport(){
  const main=document.getElementById('main-content');
  try{
    const [rr,resp]=await Promise.all([
      fetch(`${API}/interview/report/${interviewId}`,{headers:authHdr()}),
      fetch(`${API}/interview/responses/${interviewId}`,{headers:authHdr()})
    ]);
    const report=await rr.json();
    const responses=await resp.json();
    if(!rr.ok)throw new Error(report.detail||'Failed to load report');

    const grade=scoreGrade(report.overall_score);
    const strengths=parseBullets(report.strengths);
    const weaknesses=parseBullets(report.weaknesses);
    const recs=parseBullets(report.recommendations);
    const overall=Math.round(report.overall_score);
    const tech=Math.round(report.technical_score);
    const comm=Math.round(report.communication_score);
    const circ=Math.PI*2*68; // circumference r=68 → approx

    main.innerHTML=`
    <div class="report-header">
      <div class="report-badge">📋 Performance Report</div>
      <h1>Interview Complete</h1>
      <p class="meta"><strong>${responses.length}</strong> questions answered</p>
    </div>

    <div class="score-hero">
      <div class="score-ring">
        <svg viewBox="0 0 160 160" width="160" height="160">
          <circle class="ring-bg" cx="80" cy="80" r="68"/>
          <circle class="ring-fill" id="ring" cx="80" cy="80" r="68"
            stroke="${scoreColor(overall)}"
            stroke-dasharray="${circ}"
            stroke-dashoffset="${circ}"/>
        </svg>
        <div class="ring-text">
          <span class="ring-num" style="color:${scoreColor(overall)}">${overall}</span>
          <span class="ring-label">/ 100</span>
        </div>
      </div>
      <h2>Overall Score — Grade ${grade.g} (${grade.l})</h2>
      <p>${report.summary}</p>
    </div>

    <div class="grid2">
      <!-- Sub scores -->
      <div class="rcard" style="animation-delay:.1s">
        <div class="rcard-title"><span class="dot" style="background:var(--accent)"></span>Score Breakdown</div>
        <div class="score-bar-row">
          <div class="sb-item">
            <div class="sb-label"><span>Technical</span><span style="color:${scoreColor(tech)}">${tech}/100</span></div>
            <div class="sb-track"><div class="sb-fill" id="bar-tech" style="background:${scoreColor(tech)};width:0"></div></div>
          </div>
          <div class="sb-item">
            <div class="sb-label"><span>Communication</span><span style="color:${scoreColor(comm)}">${comm}/100</span></div>
            <div class="sb-track"><div class="sb-fill" id="bar-comm" style="background:${scoreColor(comm)};width:0"></div></div>
          </div>
        </div>
      </div>

      <!-- Strengths -->
      <div class="rcard" style="animation-delay:.15s">
        <div class="rcard-title"><span class="dot" style="background:var(--green)"></span>Strengths</div>
        <div class="bullet-list">
          ${strengths.map(s=>`<div class="bullet-item"><div class="bi" style="background:rgba(74,222,128,.1);color:var(--green)">✓</div><span>${s}</span></div>`).join('')}
        </div>
      </div>

      <!-- Weaknesses -->
      <div class="rcard" style="animation-delay:.2s">
        <div class="rcard-title"><span class="dot" style="background:var(--red)"></span>Areas to Improve</div>
        <div class="bullet-list">
          ${weaknesses.map(w=>`<div class="bullet-item"><div class="bi" style="background:rgba(248,113,113,.1);color:var(--red)">!</div><span>${w}</span></div>`).join('')}
        </div>
      </div>

      <!-- Recommendations -->
      <div class="rcard" style="animation-delay:.25s">
        <div class="rcard-title"><span class="dot" style="background:var(--yellow)"></span>Recommendations</div>
        <div class="bullet-list">
          ${recs.map(r=>`<div class="bullet-item"><div class="bi" style="background:rgba(251,191,36,.1);color:var(--yellow)">→</div><span>${r}</span></div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Full transcript -->
    <div class="rcard" style="animation-delay:.3s;margin-bottom:20px">
      <div class="rcard-title"><span class="dot" style="background:var(--purple)"></span>Interview Transcript</div>
      <div class="qa-list">
        ${responses.map((r,i)=>{
          const sc=r.score||0;const c=scoreColor(sc*10);
          return`<div class="qa-item">
            <div class="qa-q"><span class="qa-q-num">Q${i+1}</span>${r.question}</div>
            <div class="qa-a">${r.answer||'<em>No answer recorded</em>'}</div>
            <div class="qa-footer">
              <span class="qa-score" style="color:${c}">${sc.toFixed(1)}/10</span>
              <span class="qa-fb">${r.feedback||''}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="action-row">
      <button class="btn-action btn-dash" onclick="location.href='dashboard.html'">← Dashboard</button>
      <button class="btn-action btn-new" onclick="location.href='dashboard.html'">Start New Interview 🎙</button>
    </div>
    `;

    // animate ring
    setTimeout(()=>{
      const offset=circ*(1-overall/100);
      document.getElementById('ring').style.strokeDashoffset=offset;
      document.getElementById('bar-tech').style.width=tech+'%';
      document.getElementById('bar-comm').style.width=comm+'%';
    },200);

  }catch(e){
    main.innerHTML=`<div style="text-align:center;padding:60px 24px"><p style="color:var(--red);font-size:.9rem">${e.message}</p><button class="btn-action btn-dash" style="margin-top:16px" onclick="location.href='dashboard.html'">← Back</button></div>`;
  }
}

loadReport();
</script>
</body>
</html>
